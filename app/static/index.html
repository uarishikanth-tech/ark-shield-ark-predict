<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARK Shield — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   ARK SHIELD — design tokens
   Industrial HMI palette: deep graphite-navy base, signal-blue
   brand accent, traffic-light semantics reserved strictly for
   risk/zone/status meaning (never used decoratively).
   ============================================================ */
:root{
  --bg:#0D1117;
  --bg-raised:#121821;
  --panel:#161D27;
  --panel-2:#1B2430;
  --hairline:#28323F;
  --hairline-soft:#1F2833;
  --text:#E7EDF4;
  --text-dim:#93A2B4;
  --text-faint:#5B6B7D;
  --accent:#4E8CFF;
  --accent-dim:#1E3868;
  --accent-soft:rgba(78,140,255,0.12);
  --safe:#33D482;
  --safe-dim:rgba(51,212,130,0.14);
  --warn:#F0A83B;
  --warn-dim:rgba(240,168,59,0.14);
  --high:#E8703B;
  --high-dim:rgba(232,112,59,0.16);
  --danger:#F0473C;
  --danger-dim:rgba(240,71,60,0.16);
  --info:#8B9BB4;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius:3px;
  --radius-lg:6px;
}
:root[data-theme="light"]{
  --bg:#EEF1F5;
  --bg-raised:#F6F8FA;
  --panel:#FFFFFF;
  --panel-2:#F2F4F7;
  --hairline:#D6DCE3;
  --hairline-soft:#E4E8ED;
  --text:#101722;
  --text-dim:#4C5A6B;
  --text-faint:#8C97A5;
  --accent:#2E63D6;
  --accent-dim:#DDE8FF;
  --accent-soft:rgba(46,99,214,0.08);
  --high:#C85A26;
  --high-dim:rgba(200,90,38,0.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --bg-raised:#121821; --panel:#161D27; --panel-2:#1B2430;
    --hairline:#28323F; --hairline-soft:#1F2833;
    --text:#E7EDF4; --text-dim:#93A2B4; --text-faint:#5B6B7D;
    --accent:#4E8CFF; --accent-dim:#1E3868; --accent-soft:rgba(78,140,255,0.12);
  }
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:13.5px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--accent-soft);}
button{font-family:inherit;}
a{color:var(--accent);}
.mono{font-family:var(--font-mono);}
.hidden{display:none !important;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:5px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

/* ---------- login ---------- */
#login-screen{
  position:fixed;inset:0;background:
    radial-gradient(circle at 18% 20%, rgba(78,140,255,0.10), transparent 45%),
    radial-gradient(circle at 82% 78%, rgba(51,212,130,0.06), transparent 40%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;z-index:500;
}
.login-card{
  width:420px;max-width:92vw;background:var(--panel);
  border:1px solid var(--hairline);border-radius:var(--radius-lg);
  padding:36px 34px 30px;
}
.login-brand{display:flex;align-items:center;gap:11px;margin-bottom:6px;}
.login-brand svg{flex:none;}
.login-brand-text{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:0.5px;}
.login-brand-text b{color:var(--accent);}
.login-tag{color:var(--text-dim);font-size:12.5px;margin:0 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.2px;}
.field input, .field select{
  width:100%;background:var(--bg-raised);border:1px solid var(--hairline);
  color:var(--text);padding:9px 11px;border-radius:var(--radius);font-size:13.5px;
}
.field input:focus, .field select:focus{border-color:var(--accent);}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px;}
.role-opt{
  border:1px solid var(--hairline);background:var(--bg-raised);border-radius:var(--radius);
  padding:9px 10px;cursor:pointer;font-size:12px;color:var(--text-dim);
}
.role-opt .rname{color:var(--text);font-weight:600;display:block;font-size:12.5px;}
.role-opt.active{border-color:var(--accent);background:var(--accent-soft);color:var(--text);}
.btn-primary{
  width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
  padding:11px;font-size:13.5px;font-weight:600;cursor:pointer;
}
.btn-primary:hover{filter:brightness(1.08);}
.login-note{color:var(--text-faint);font-size:11px;margin-top:16px;text-align:center;}

/* ---------- app shell ---------- */
#app{display:none;height:100vh;}
#app.show{display:flex;}
.sidebar{
  width:216px;flex:none;background:var(--bg-raised);border-right:1px solid var(--hairline);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;
}
.brand-row{padding:18px 18px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--hairline-soft);}
.brand-row .brand-text{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.4px;}
.brand-row .brand-text b{color:var(--accent);}
.nav{flex:1;overflow-y:auto;padding:10px 8px;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);padding:12px 10px 5px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);
  color:var(--text-dim);font-size:13px;cursor:pointer;margin-bottom:1px;position:relative;
}
.nav-item svg{flex:none;opacity:.85;}
.nav-item:hover{background:var(--panel-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--text);}
.nav-item.active svg{color:var(--accent);opacity:1;}
.nav-item .nbadge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:8px;
}
.sim-indicator{
  margin:8px 10px 12px;padding:9px 10px;border:1px solid var(--hairline);border-radius:var(--radius);
  background:var(--panel);font-size:11px;color:var(--text-dim);
}
.sim-indicator .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--text-faint);}
.sim-indicator.running .dot{background:var(--safe);box-shadow:0 0 0 3px var(--safe-dim);}
.sim-indicator .lbl{font-weight:700;letter-spacing:.4px;color:var(--text);}

.main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:54px;flex:none;border-bottom:1px solid var(--hairline);display:flex;align-items:center;
  padding:0 20px;gap:14px;background:var(--bg);position:sticky;top:0;z-index:20;
}
.topbar .crumbs{font-size:12px;color:var(--text-dim);}
.topbar .crumbs b{color:var(--text);font-weight:600;}
.org-select{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-dim);}
.org-select select{background:var(--bg-raised);border:1px solid var(--hairline);color:var(--text);border-radius:var(--radius);padding:5px 8px;font-size:12px;}
.spacer{flex:1;}
.icon-btn{
  width:32px;height:32px;border-radius:var(--radius);border:1px solid transparent;background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;position:relative;
}
.icon-btn:hover{background:var(--panel-2);color:var(--text);border-color:var(--hairline);}
.icon-btn .abadge{
  position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;border-radius:8px;
  font-size:9px;font-weight:700;padding:0 4px;line-height:14px;min-width:14px;text-align:center;
}
.profile-chip{display:flex;align-items:center;gap:8px;padding:5px 9px 5px 5px;border-radius:20px;border:1px solid var(--hairline);cursor:pointer;}
.profile-chip .av{width:24px;height:24px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.profile-chip .role{font-size:10.5px;color:var(--text-faint);display:block;}
.profile-chip .name{font-size:12px;color:var(--text);display:block;line-height:1.2;}

.content{padding:20px 22px 40px;max-width:1500px;width:100%;margin:0 auto;}
.view-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.view-title{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:.3px;}
.view-sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
.view-actions{display:flex;gap:8px;}

/* ---------- generic components ---------- */
.btn{
  border:1px solid var(--hairline);background:var(--panel-2);color:var(--text);border-radius:var(--radius);
  padding:7px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--accent);color:var(--text);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.accent:hover{filter:brightness(1.08);}
.btn.danger-o{border-color:var(--danger);color:var(--danger);background:transparent;}
.btn.sm{padding:4px 9px;font-size:11.5px;}

.grid{display:grid;gap:14px;}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));}
.g-2{grid-template-columns:1.6fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:1180px){.g-2,.g-3{grid-template-columns:1fr;}}

.panel{
  background:var(--panel);border:1px solid var(--hairline);border-radius:var(--radius-lg);
  padding:16px 16px;
}
.panel-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:12px;}
.panel-title{font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:.3px;}
.panel-title small{display:block;font-family:var(--font-body);font-size:11px;color:var(--text-faint);font-weight:400;margin-top:1px;}

.stat-tile{
  background:var(--panel);border:1px solid var(--hairline);border-radius:var(--radius-lg);
  padding:13px 14px;position:relative;overflow:hidden;
}
.stat-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tile-c,var(--hairline));}
.stat-tile .lbl{font-size:11px;color:var(--text-dim);letter-spacing:.2px;}
.stat-tile .val{font-family:var(--font-mono);font-size:25px;font-weight:600;margin-top:4px;line-height:1;}
.stat-tile .sub{font-size:11px;color:var(--text-faint);margin-top:5px;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.3px;}
.badge.safe,.badge.low,.badge.online,.badge.active,.badge.authorized,.badge.current{background:var(--safe-dim);color:var(--safe);}
.badge.warn,.badge.caution,.badge.medium,.badge.warning,.badge.degraded,.badge.idle,.badge.charging{background:var(--warn-dim);color:var(--warn);}
.badge.high{background:var(--high-dim);color:var(--high);}
.badge.danger,.badge.critical,.badge.offline,.badge.maintenance,.badge.unauthorized{background:var(--danger-dim);color:var(--danger);}
.badge.info,.badge.acknowledged,.badge.resolved,.badge.closed,.badge.reviewed{background:rgba(139,155,180,0.14);color:var(--info);}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);
   font-weight:600;padding:8px 10px;border-bottom:1px solid var(--hairline);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--hairline-soft);font-size:12.5px;vertical-align:middle;white-space:nowrap;}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--panel-2);}
.table-wrap{overflow-x:auto;}
.table-wrap table{min-width:640px;}
.empty-row td{color:var(--text-faint);text-align:center;padding:26px;white-space:normal;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hairline);margin-bottom:14px;}
.tab{padding:8px 14px;font-size:12.5px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filter-row select, .filter-row input[type=text]{
  background:var(--bg-raised);border:1px solid var(--hairline);color:var(--text);
  padding:6px 9px;border-radius:var(--radius);font-size:12px;
}

.alert-card{border:1px solid var(--hairline);border-left:3px solid var(--sev-c,var(--hairline));border-radius:var(--radius);
  padding:11px 12px;margin-bottom:9px;background:var(--panel-2);}
.alert-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.alert-card .ttl{font-weight:700;font-size:12.5px;letter-spacing:.2px;}
.alert-card .meta{font-size:11.5px;color:var(--text-dim);margin-bottom:8px;}
.alert-card .meta b{color:var(--text);font-weight:600;}
.alert-card .acts{display:flex;gap:6px;flex-wrap:wrap;}

.map-wrap{position:relative;background:var(--bg-raised);border:1px solid var(--hairline);border-radius:var(--radius-lg);overflow:hidden;}
.map-legend{position:absolute;bottom:10px;left:10px;background:rgba(13,17,23,0.82);border:1px solid var(--hairline);
  border-radius:var(--radius);padding:8px 10px;font-size:10.5px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap;}
:root[data-theme="light"] .map-legend{background:rgba(255,255,255,0.85);}
.map-legend span{display:flex;align-items:center;gap:5px;}
.map-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.sim-banner{position:absolute;top:10px;left:10px;background:rgba(13,17,23,0.82);border:1px solid var(--accent);
  color:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:.6px;padding:5px 10px;border-radius:20px;}
:root[data-theme="light"] .sim-banner{background:rgba(255,255,255,0.9);}

.risk-gauge{text-align:center;padding:6px 0 4px;}
.risk-gauge .num{font-family:var(--font-mono);font-size:44px;font-weight:600;line-height:1;}
.risk-gauge .lbl{font-size:11px;color:var(--text-dim);margin-top:6px;letter-spacing:.4px;}
.risk-gauge .track{height:6px;background:var(--hairline);border-radius:4px;margin-top:12px;overflow:hidden;}
.risk-gauge .fill{height:100%;border-radius:4px;}

.kv-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--hairline-soft);font-size:12.5px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--text-dim);}
.kv-row .v{font-weight:600;}
.kv-row .v.mono{font-family:var(--font-mono);}

.cam-frame{position:relative;background:#05070A;border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:16/9;border:1px solid var(--hairline);}
.cam-frame svg{width:100%;height:100%;display:block;}
.cam-hud{position:absolute;top:8px;left:10px;font-family:var(--font-mono);font-size:10px;color:#8fd0ff;text-shadow:0 1px 2px #000;}
.cam-hud-r{position:absolute;top:8px;right:10px;font-family:var(--font-mono);font-size:10px;color:#8fd0ff;text-shadow:0 1px 2px #000;text-align:right;}

.detail-drawer{position:fixed;top:0;right:0;height:100vh;width:400px;max-width:92vw;background:var(--panel);
  border-left:1px solid var(--hairline);z-index:200;transform:translateX(100%);transition:transform .22s ease;
  overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,.35);}
.detail-drawer.open{transform:translateX(0);}
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:190;opacity:0;pointer-events:none;transition:opacity .2s;}
.drawer-scrim.open{opacity:1;pointer-events:auto;}
.drawer-head{padding:16px 18px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between;}
.drawer-body{padding:16px 18px;}
.drawer-close{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;line-height:1;}

.toast-stack{position:fixed;bottom:18px;right:18px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--panel);border:1px solid var(--hairline);border-left:3px solid var(--sev-c,var(--accent));
  border-radius:var(--radius);padding:10px 14px;font-size:12.5px;min-width:250px;max-width:340px;
  box-shadow:0 6px 18px rgba(0,0,0,.3);animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.toast b{display:block;margin-bottom:2px;}

.zone-swatch{width:12px;height:12px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px;}
.checklist{display:flex;flex-direction:column;gap:8px;}
.checklist label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);}

.slider-row{margin-bottom:16px;}
.slider-row .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
.slider-row input[type=range]{width:100%;accent-color:var(--accent);}
.notice-box{border:1px solid var(--warn);background:var(--warn-dim);color:var(--warn);border-radius:var(--radius);
  padding:10px 12px;font-size:12px;margin-bottom:14px;}
.notice-box.danger{border-color:var(--danger);background:var(--danger-dim);color:var(--danger);}

.health-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--hairline-soft);font-size:12.5px;}
.health-row:last-child{border-bottom:none;}
.dot-status{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;}
.dot-status.online{background:var(--safe);}
.dot-status.degraded{background:var(--warn);}
.dot-status.offline{background:var(--danger);}

.empty-state{text-align:center;padding:44px 20px;color:var(--text-faint);}
.empty-state svg{opacity:.4;margin-bottom:10px;}

@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;z-index:150;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .content{padding:16px;}
  .detail-drawer{width:100%;}
}
.menu-toggle{display:none;}
@media(max-width:880px){.menu-toggle{display:flex;}}

@media (prefers-reduced-motion: reduce){
  .toast{animation:none;}
  .detail-drawer{transition:none;}
  *{scroll-behavior:auto !important;}
}
/* ---------- ARK Predict (machine-health anomaly detection) ---------- */
.pr-actions{align-items:center;flex-wrap:wrap;}
.pr-actions select,.pr-inject select,#pr-points,#pr-rate{background:var(--bg-raised);border:1px solid var(--hairline);color:var(--text);
  border-radius:var(--radius);padding:5px 8px;font-size:12px;font-family:var(--font-body);}
.pr-fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:10px;}
.pr-truck{background:var(--panel);border:1px solid var(--hairline);border-left:3px solid var(--tc);border-radius:var(--radius-lg);
  padding:10px 12px;cursor:pointer;min-width:0;transition:border-color .15s;}
.pr-truck:hover{border-color:var(--accent);border-left-color:var(--tc);}
.pr-truck.sel{outline:1px solid var(--accent);background:var(--panel-2);}
.pr-truck-hd{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;}
.pr-truck-hd .mono{font-size:11px;}
.pr-truck-tier{margin:6px 0 4px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);}
.pr-truck-msg{font-size:11.5px;color:var(--text-dim);line-height:1.35;min-height:31px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;}
.pr-truck-ft{font-size:10.5px;color:var(--text-faint);margin-top:5px;font-family:var(--font-mono);}
.pr-chart-row{margin-bottom:6px;}
.pr-chart-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--text-dim);flex-wrap:wrap;}
.pr-chart-hd small{color:var(--text-faint);}
.pr-chart-hd .mono{font-size:11px;color:var(--text);display:flex;gap:4px;align-items:center;}
.pr-chart-box{height:74px;position:relative;border-bottom:1px solid var(--hairline-soft);}

<script>
/* ============================================================
   ARK SHIELD — data model, seed data, risk engine, simulation
   ============================================================ */

/* ---------- tiny utils ---------- */
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function rand(min,max){ return min + Math.random()*(max-min); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function dist2(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function fmtClock(d){ return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
function fmtDateTime(d){ return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + fmtClock(d); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pointInRect(p, r){ return p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h; }

const METERS_PER_UNIT = 0.072; // conceptual map scale
function metersBetween(a,b){ return dist2(a,b) * METERS_PER_UNIT; }

/* ---------- static reference data ---------- */

function canEdit(role){ return ['SUPER_ADMIN','SAFETY_MANAGER','FLEET_MANAGER'].includes(role); }
function canAckAlerts(role){ return ['SUPER_ADMIN','SAFETY_MANAGER','FLEET_MANAGER','SUPERVISOR'].includes(role); }

/* ---------- zones (fixed map layout, viewBox 0 0 1000 560) ---------- */

     route:[{x:900,y:480},{x:800,y:280},{x:700,y:220}], routeIdx:0, dir:1, speedKmh:0, riskScore:0, riskState:'LOW', proxState:'SAFE'},

}

function seedCameras(forklifts){
  return forklifts.map(f => ({id:f.camera, mount:'Forklift-mounted', forklift:f.id, status: f.status==='OFFLINE' ? 'OFFLINE':'ONLINE'}));
}

function seedWorkers(){
  const out = [];
  for(let i=1;i<=8;i++){
    out.push({
      id:'W-'+pad2(i), tag:'TAG-40'+(i+10),
      x: rand(80,920), y: rand(60,500), vx:0, vy:0,
    });
  }
  return out;
}

function seedMaintenance(){
  return [
    {id:uid('MR'), forklift:'ARK-F001', type:'Scheduled Service', date:'2026-08-02', notes:'250-hr service, hydraulic fluid, filters', status:'COMPLETE'},
    {id:uid('MR'), forklift:'ARK-F002', type:'Tire Replacement', date:'2026-07-18', notes:'Front load wheels replaced', status:'COMPLETE'},
    {id:uid('MR'), forklift:'ARK-F003', type:'Scheduled Service', date:'2026-08-21', notes:'500-hr service', status:'COMPLETE'},
    {id:uid('MR'), forklift:'ARK-F004', type:'Battery Inspection', date:'2026-06-30', notes:'Cell voltage check, terminals cleaned', status:'COMPLETE'},
    {id:uid('MR'), forklift:'ARK-F005', type:'Scheduled Service', date:'2026-08-14', notes:'750-hr service — overdue, forklift taken offline', status:'OVERDUE'},
  ];
}

/* ---------- risk engine ----------
   Conceptual demo model only — NOT a scientifically validated
   collision-prediction system. See ARK Predict for the future
   trained-model track. */
const RISK_BANDS = [
  {max:29, key:'LOW', color:'--safe'},
  {max:59, key:'CAUTION', color:'--warn'},
  {max:79, key:'HIGH', color:'--high'},
  {max:100, key:'CRITICAL', color:'--danger'},
];
function riskStateFor(score){
  for(const b of RISK_BANDS){ if(score<=b.max) return b.key; }
  return 'CRITICAL';
}
function riskColorVar(state){
  return state==='LOW' ? '--safe' : state==='CAUTION' ? '--warn' : state==='HIGH' ? '--high' : '--danger';
}
function computeRisk({distanceM, zoneSeverity, converging, objectType}){
  let distanceFactor;
  if(distanceM<=3) distanceFactor=45;
  else if(distanceM<=6) distanceFactor=34;
  else if(distanceM<=8) distanceFactor=26;
  else if(distanceM<=12) distanceFactor=16;
  else if(distanceM<=18) distanceFactor=6;
  else distanceFactor=0;
  const speedFactor = Math.round(rand(2,9));
  const trajectoryFactor = converging ? 12 : 0;
  const zoneFactor = zoneSeverity==='red' ? 18 : zoneSeverity==='amber' ? 9 : 0;
  const objectTypeFactor = objectType==='pedestrian' ? 12 : objectType==='vehicle' ? 6 : 0;
  const score = clamp(distanceFactor+speedFactor+trajectoryFactor+zoneFactor+objectTypeFactor, 0, 100);
  return {score, distanceFactor, speedFactor, trajectoryFactor, zoneFactor, objectTypeFactor};
}
function proximityStateFor(distanceM, thresholds){
  if(distanceM >= thresholds.safe) return 'SAFE';
  if(distanceM >= thresholds.warning) return 'WARNING';
  return 'DANGER';
}
const PROX_RANK = {SAFE:0, WARNING:1, DANGER:2};

function zoneAt(point, zones){
  for(const z of zones){ if(pointInRect(point, z)) return z; }
  return null;
}
/* ============================================================
   ARK SHIELD — application state + simulation engine
   ============================================================ */

const state = {
  auth: {loggedIn:false, name:'', role:null},
  theme: 'dark',
  org: {name:'Meridian Logistics Group', site:'Riverside Distribution Site', warehouse:'Warehouse 4 — Riverside DC'},
  sim: {running:false, tick:0, traffic:1, timer:null},
  thresholds: {safe:15, warning:8},
  zones: seedZones(),
  anchors: seedAnchors(),
  operators: seedOperators(),
  forklifts: seedForklifts(),
  workers: seedWorkers(),
  maintenance: seedMaintenance(),
  events: [],
  alerts: [],
  systemHealth: [
    {id:'ai', label:'AI Inference Service', status:'ONLINE', simulated:true},
    {id:'cam', label:'Camera Connectivity', status:'ONLINE', simulated:true},
    {id:'uwbgw', label:'UWB Gateway', status:'ONLINE', simulated:true},
    {id:'uwbanchors', label:'UWB Anchors', status:'ONLINE', simulated:true},
    {id:'db', label:'Database', status:'ONLINE', simulated:false},
    {id:'rt', label:'Real-Time Connection', status:'ONLINE', simulated:false},
    {id:'telemetry', label:'Fleet Telemetry', status:'ONLINE', simulated:true},
  ],
  activeView:'overview',
  drawer:{open:false, type:null, id:null},
  eventFilters:{severity:'ALL', type:'ALL', range:'today'},
  charts:{},
  toastSeq:0,
  lastAlertTickByKey:{},
  visionForkliftId:null,
};
state.cameras = seedCameras(state.forklifts);

/* Prime a few historical events/alerts so the app doesn't look empty on first load */
(function primeHistory(){
  const now = Date.now();
  const sevs=['LOW','MEDIUM','HIGH'];
  const types=['PEDESTRIAN PROXIMITY','SPEED VIOLATION','COLLISION RISK'];
  for(let i=0;i<6;i++){
    const f = pick(state.forklifts);
    const sev = pick(sevs);
    state.events.push({
      id: uid('EVT'), ts: now - rand(6,90)*60000, type: pick(types), severity: sev,
      forklift: f.id, operator: f.operator, zone: pick(state.zones).name,
      object: 'Pedestrian', distance: (rand(3,16)).toFixed(1), risk: Math.round(rand(20,70)),
      source: 'ARK Proximity', status:'REVIEWED',
    });
  }
  state.events.sort((a,b)=>b.ts-a.ts);
})();

/* ---------- alert / event creation ---------- */
function pushToast(sevKey, title, msg){
  const id = ++state.toastSeq;
  const t = {id, sevKey, title, msg};
  const stack = document.getElementById('toast-stack');
  if(!stack) return;
  const el = document.createElement('div');
  el.className='toast'; el.style.setProperty('--sev-c', sevColor(sevKey));
  el.innerHTML = `<b>${escapeHtml(title)}</b>${escapeHtml(msg)}`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 5200);
}
function sevColor(sevKey){
  const map={LOW:'--safe',INFO:'--info',MEDIUM:'--warn',WARNING:'--warn',HIGH:'--danger',CRITICAL:'--danger',SAFE:'--safe'};
  const v = map[sevKey] || '--accent';
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#4E8CFF';
}

function logEvent({type, severity, forklift, zone, object, distance, risk, source}){
  const f = state.forklifts.find(x=>x.id===forklift);
  const ev = {
    id: uid('EVT'), ts: Date.now(), type, severity,
    forklift, operator: f ? f.operator : null, zone, object, distance, risk, source,
    status:'OPEN',
  };
  state.events.unshift(ev);
  if(state.events.length>400) state.events.length=400;
  return ev;
}
function createAlert({severity, title, forklift, worker, distance, risk, zone, type}){
  const al = {
    id: uid('ALT'), ts: Date.now(), severity, title, forklift, worker, distance, risk, zone, type,
    status:'ACTIVE',
  };
  state.alerts.unshift(al);
  if(state.alerts.length>200) state.alerts.length=200;
  pushToast(severity, title, `${forklift}${worker ? ' · nearest '+worker : ''}${distance!=null ? ' · '+distance+'m' : ''}`);
  return al;
}
function activeAlertsFor(forkliftId){
  return state.alerts.filter(a=>a.forklift===forkliftId && a.status==='ACTIVE');
}
function resolveProximityAlerts(forkliftId){
  state.alerts.forEach(a=>{
    if(a.forklift===forkliftId && a.type==='PROXIMITY' && a.status==='ACTIVE'){ a.status='RESOLVED'; }
  });
}
function cooldownOk(key, ticks){
  const last = state.lastAlertTickByKey[key] || -999;
  if(state.sim.tick - last < ticks) return false;
  state.lastAlertTickByKey[key] = state.sim.tick;
  return true;
}

/* ---------- movement ---------- */
function stepForklift(f){
  const statusMoves = f.status==='ACTIVE';
  if(!statusMoves){
    f.speedKmh = f.status==='CHARGING' ? 0 : 0;
    if(f.status==='CHARGING' && f.battery!=null) f.battery = clamp(f.battery + 0.15, 0, 100);
    return;
  }
  const zone = zoneAt(f, state.zones);
  const limit = zone ? zone.speedLimit : 12;
  const base = 7 + state.sim.traffic*1.6;
  f.speedKmh = clamp(base + rand(-2.2,3.4), 0, 16);
  // occasional speed violation, tied to actual zone limit
  if(zone && limit>0 && f.speedKmh > limit + 1.5){
    if(cooldownOk('speed:'+f.id, 22)){
      const ev = logEvent({type:'SPEED VIOLATION', severity:'MEDIUM', forklift:f.id, zone:zone.name,
        object:'—', distance:'—', risk: Math.round(rand(35,55)), source:'ARK Fleet'});
      createAlert({severity:'MEDIUM', title:'SPEED VIOLATION', forklift:f.id, distance:null,
        risk: ev.risk, zone: zone.name, type:'SPEED'});
    }
  }
  const target = f.route[f.routeIdx];
  const dx = target.x-f.x, dy = target.y-f.y;
  const d = Math.hypot(dx,dy);
  const step = 3.2 + state.sim.traffic*0.9;
  if(d < step){
    f.x = target.x; f.y = target.y;
    f.routeIdx += f.dir;
    if(f.routeIdx>=f.route.length){ f.routeIdx=f.route.length-2; f.dir=-1; }
    if(f.routeIdx<0){ f.routeIdx=1; f.dir=1; }
  } else {
    f.x += (dx/d)*step; f.y += (dy/d)*step;
  }
  if(f.fuel!=null) f.fuel = clamp(f.fuel - 0.02, 0, 100);
  if(f.battery!=null) f.battery = clamp(f.battery - 0.05, 0, 100);
  f.hours += (0.8/3600);
}

function stepWorker(w){
  const restricted = state.zones.find(z=>z.id==='restricted');
  const tempted = Math.random() < (0.01 + state.sim.traffic*0.006);
  let tx = w.x + rand(-1,1)*22, ty = w.y + rand(-1,1)*22;
  if(restricted && !tempted && pointInRect({x:tx,y:ty}, inflate(restricted,30))){
    // repel away from restricted zone under normal conditions
    const cx = restricted.x+restricted.w/2, cy = restricted.y+restricted.h/2;
    tx = w.x + (w.x-cx)*0.08; ty = w.y + (w.y-cy)*0.08;
  }
  w.x = clamp(tx, 30, 970); w.y = clamp(ty, 30, 530);
}
function inflate(r, n){ return {x:r.x-n,y:r.y-n,w:r.w+2*n,h:r.h+2*n}; }

function nearestWorker(f){
  let best=null, bd=Infinity;
  for(const w of state.workers){
    const dm = metersBetween(f, w);
    if(dm<bd){ bd=dm; best=w; }
  }
  return {worker:best, distanceM:bd};
}
function nearestForklift(f){
  let best=null, bd=Infinity;
  for(const o of state.forklifts){
    if(o.id===f.id || o.status!=='ACTIVE') continue;
    const dm = metersBetween(f,o);
    if(dm<bd){ bd=dm; best=o; }
  }
  return {forklift:best, distanceM:bd};
}

/* ---------- main tick ---------- */
function simTick(){
  state.sim.tick++;
  state.forklifts.forEach(stepForklift);
  state.workers.forEach(stepWorker);

  state.forklifts.forEach(f=>{
    if(f.status!=='ACTIVE'){ f.riskScore=0; f.riskState='LOW'; f.proxState='SAFE'; f._nearestWorker=null; f._nearestDist=null; return; }
    const {worker, distanceM} = nearestWorker(f);
    const zone = zoneAt(f, state.zones);
    const prevDist = f._nearestDist;
    const converging = prevDist!=null && distanceM < prevDist - 0.05;
    const risk = computeRisk({distanceM, zoneSeverity: zone?zone.severity:'green', converging, objectType:'pedestrian'});
    f.riskScore = Math.round(risk.score);
    f.riskState = riskStateFor(f.riskScore);
    f._nearestWorker = worker ? worker.id : null;
    f._nearestDist = distanceM;
    f._zone = zone ? zone.name : 'Open Floor';
    f._converging = converging;

    const newProx = proximityStateFor(distanceM, state.thresholds);
    const oldRank = PROX_RANK[f.proxState] ?? 0, newRank = PROX_RANK[newProx];
    if(newRank > oldRank){
      const key = 'prox:'+f.id;
      if(cooldownOk(key, 10)){
        const sev = newProx==='DANGER' ? 'CRITICAL' : 'MEDIUM';
        const title = newProx==='DANGER' ? 'DANGER — PEDESTRIAN TOO CLOSE' : 'PROXIMITY WARNING';
        logEvent({type:'PEDESTRIAN PROXIMITY', severity:sev, forklift:f.id, zone:f._zone,
          object: worker?worker.id:'Pedestrian', distance:distanceM.toFixed(1), risk:f.riskScore, source:'ARK Proximity'});
        createAlert({severity:sev, title, forklift:f.id, worker:worker?worker.id:null,
          distance:distanceM.toFixed(1), risk:f.riskScore, zone:f._zone, type:'PROXIMITY'});
      }
    } else if(newProx==='SAFE' && oldRank>0){
      resolveProximityAlerts(f.id);
    }
    f.proxState = newProx;

    if((f.riskState==='HIGH' || f.riskState==='CRITICAL')){
      const key='vision:'+f.id;
      if(cooldownOk(key, 14)){
        const sev = f.riskState==='CRITICAL' ? 'CRITICAL':'HIGH';
        logEvent({type:'COLLISION RISK', severity:sev, forklift:f.id, zone:f._zone,
          object: worker?worker.id:'Pedestrian', distance:distanceM.toFixed(1), risk:f.riskScore, source:'ARK Vision'});
        if(f.riskState==='CRITICAL'){
          createAlert({severity:'CRITICAL', title:'CRITICAL COLLISION RISK', forklift:f.id, worker:worker?worker.id:null,
            distance:distanceM.toFixed(1), risk:f.riskScore, zone:f._zone, type:'VISION'});
          pushToast('CRITICAL','DEMO ONLY — Simulated audible + strobe warning triggered', f.id);
        }
      }
    }
  });

  // rare grounded flavor events
  maybeUnauthorizedOperation();
  maybeSystemHealthBlip();

  renderLiveWidgets();
  if(document.body.contains(document.getElementById('view-root'))){
    renderCurrentView(true);
  }
}
function maybeUnauthorizedOperation(){
  if(Math.random() > 0.006) return;
  const op = state.operators.find(o=>o.status==='SUSPENDED' || o.training==='EXPIRED' || o.training==='DUE FOR RENEWAL');
  if(!op || !op.forklift) return;
  if(!cooldownOk('unauth:'+op.id, 200)) return;
  logEvent({type:'UNAUTHORIZED OPERATION', severity:'MEDIUM', forklift:op.forklift, zone:'—',
    object:op.id, distance:'—', risk: Math.round(rand(30,50)), source:'ARK Fleet'});
  createAlert({severity:'MEDIUM', title:'UNAUTHORIZED OPERATION', forklift:op.forklift, distance:null,
    risk:null, zone:null, type:'AUTH'});
}
function maybeSystemHealthBlip(){
  if(Math.random() > 0.004) return;
  const cand = state.systemHealth.find(h=>h.simulated && h.status==='ONLINE');
  if(!cand) return;
  cand.status='DEGRADED';
  logEvent({type: cand.id==='cam' ? 'CAMERA ALERT':'UWB ALERT', severity:'LOW', forklift:'—', zone:'—',
    object:cand.label, distance:'—', risk:null, source:'System'});
  setTimeout(()=>{ cand.status='ONLINE'; }, 9000);
}

/* ---------- simulation controls ---------- */
function startSim(){
  if(state.sim.running) return;
  state.sim.running = true;
  state.sim.timer = setInterval(simTick, 850);
  updateSimIndicator();
}
function pauseSim(){
  state.sim.running = false;
  clearInterval(state.sim.timer);
  updateSimIndicator();
}
function resetSim(){
  pauseSim();
  state.zones = seedZones();
  state.anchors = seedAnchors();
  state.forklifts = seedForklifts();
  state.workers = seedWorkers();
  state.cameras = seedCameras(state.forklifts);
  state.events = [];
  state.alerts = [];
  state.sim.tick = 0;
  state.sim.traffic = 1;
  state.lastAlertTickByKey = {};
  state.systemHealth.forEach(h=>h.status='ONLINE');
  renderLiveWidgets();
  renderCurrentView(true);
  pushToast('INFO','Simulation reset','All positions and history cleared');
}
function increaseTraffic(){
  state.sim.traffic = clamp(state.sim.traffic+1, 1, 3);
  if(state.sim.traffic>=2){
    const f4 = state.forklifts.find(x=>x.id==='ARK-F004');
    if(f4 && f4.status==='CHARGING' && f4.battery>45){ f4.status='ACTIVE'; }
  }
  if(state.sim.traffic>=3){
    const f5 = state.forklifts.find(x=>x.id==='ARK-F005');
    if(f5 && f5.status==='OFFLINE'){ f5.status='ACTIVE'; f5.operator='OP-004'; }
  }
  if(state.workers.length<12){ state.workers.push(...seedWorkers().slice(0,2).map(w=>({...w,id:'W-'+pad2(state.workers.length+1),tag:'TAG-'+(5000+state.workers.length)}))); }
  pushToast('INFO','Traffic increased', 'Level '+state.sim.traffic+' of 3');
  renderCurrentView(true);
}
function triggerWarning(){
  const f = state.forklifts.find(x=>x.status==='ACTIVE') || state.forklifts[0];
  if(!f) return;
  const w = state.workers[0];
  w.x = f.x + rand(-1,1)*80; w.y = f.y + rand(-1,1)*80;
  state.lastAlertTickByKey['prox:'+f.id] = -999;
  const dm = 10.5;
  logEvent({type:'PEDESTRIAN PROXIMITY', severity:'MEDIUM', forklift:f.id, zone:f._zone||'Open Floor',
    object:w.id, distance:dm.toFixed(1), risk:52, source:'ARK Proximity'});
  createAlert({severity:'MEDIUM', title:'PROXIMITY WARNING', forklift:f.id, worker:w.id,
    distance:dm.toFixed(1), risk:52, zone:f._zone||'Open Floor', type:'PROXIMITY'});
  f.proxState='WARNING'; f.riskScore=Math.max(f.riskScore,52); f.riskState='CAUTION';
  renderCurrentView(true);
}
function triggerCritical(){
  const f = state.forklifts.find(x=>x.status==='ACTIVE') || state.forklifts[0];
  if(!f) return;
  const w = state.workers[1] || state.workers[0];
  w.x = f.x + rand(-1,1)*18; w.y = f.y + rand(-1,1)*18;
  state.lastAlertTickByKey['prox:'+f.id] = -999;
  state.lastAlertTickByKey['vision:'+f.id] = -999;
  const dm = 3.2;
  const useImpactLabel = Math.random()<0.3;
  logEvent({type: useImpactLabel?'IMPACT':'PEDESTRIAN PROXIMITY', severity:'CRITICAL', forklift:f.id, zone:f._zone||'Open Floor',
    object:w.id, distance:dm.toFixed(1), risk:93, source:'ARK Vision'});
  createAlert({severity:'CRITICAL', title: useImpactLabel? 'IMPACT — DEMO ONLY':'DANGER — PEDESTRIAN TOO CLOSE', forklift:f.id, worker:w.id,
    distance:dm.toFixed(1), risk:93, zone:f._zone||'Open Floor', type:'PROXIMITY'});
  pushToast('CRITICAL','DEMO ONLY — Simulated emergency stop signal sent', f.id);
  f.proxState='DANGER'; f.riskScore=93; f.riskState='CRITICAL';
  renderCurrentView(true);
}

function renderLiveWidgets(){
  const activeCount = state.alerts.filter(a=>a.status==='ACTIVE').length;
  const badge = document.getElementById('alert-badge');
  const navBadge = document.getElementById('nav-alert-badge');
  [badge, navBadge].forEach(b=>{
    if(!b) return;
    if(activeCount>0){ b.textContent=activeCount; b.classList.remove('hidden'); }
    else { b.classList.add('hidden'); }
  });
}

function toggleTheme(){
  const root = document.documentElement;

}

function goTo(viewId){
  state.activeView = viewId;
  document.getElementById('sidebar').classList.remove('open');
  renderSidebarNav();
  renderCurrentView(false);
}

function renderCurrentView(isTick){
  if(isTick && !TICK_RENDER_VIEWS.has(state.activeView)) { renderLiveWidgets(); return; }
  const root = document.getElementById('view-root');
  if(!root) return;
  const scrollY = root.scrollTop;
  const renderers = {
    overview: renderOverview, vision: renderVision, proximity: renderProximity,
    fleet: renderFleet, livemap: renderLiveMap, events: renderEvents, alerts: renderAlerts,
    analytics: renderAnalytics, operators: renderOperators, devices: renderDevices,
    zones: renderZones, maintenance: renderMaintenance, predict: renderPredict, settings: renderSettings,
  };
  const fn = renderers[state.activeView] || renderOverview;
  root.innerHTML = fn();
  renderLiveWidgets();
  if(!isTick) window.scrollTo(0,0);
}

function proxBadge(state){
  const cls = state==='SAFE'?'safe':state==='WARNING'?'warning':'danger';

function statusBadge(status){
  const cls = {ACTIVE:'active',IDLE:'idle',CHARGING:'charging',MAINTENANCE:'maintenance',OFFLINE:'offline',
    AUTHORIZED:'authorized',SUSPENDED:'unauthorized',CURRENT:'current','DUE FOR RENEWAL':'warning',EXPIRED:'unauthorized',
    ONLINE:'online',DEGRADED:'degraded',OPEN:'warning',REVIEWED:'info',CLOSED:'resolved',ACKNOWLEDGED:'acknowledged',
    RESOLVED:'resolved',COMPLETE:'active',OVERDUE:'critical'}[status] || 'info';

}
function panelHead(title, sub, right){

function timeAgo(ts){
  const s = Math.round((Date.now()-ts)/1000);
  if(s<60) return s+'s ago';
  if(s<3600) return Math.round(s/60)+'m ago';
  return Math.round(s/3600)+'h ago';
}

/* ---------- warehouse map ---------- */
function buildWarehouseMapSVG(opts){
  opts = Object.assign({showWorkers:true, showAnchors:false, showZoneLabels:true, interactive:true}, opts||{});
  const zoneColor = z => z.severity==='red' ? 'var(--danger)' : z.severity==='amber' ? 'var(--warn)' : 'var(--safe)';
  let s = `<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">`;
  s += `<rect x="0" y="0" width="1000" height="560" fill="var(--bg-raised)"/>`;
  // faint grid
  for(let gx=0; gx<=1000; gx+=40){ s += `<line x1="${gx}" y1="0" x2="${gx}" y2="560" stroke="var(--hairline-soft)" stroke-width="1"/>`; }
  for(let gy=0; gy<=560; gy+=40){ s += `<line x1="0" y1="${gy}" x2="1000" y2="${gy}" stroke="var(--hairline-soft)" stroke-width="1"/>`; }
  // zones
  state.zones.forEach(z=>{
    const c = zoneColor(z);
    s += `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="6" fill="${c}" fill-opacity="0.08" stroke="${c}" stroke-width="1.4" stroke-dasharray="${z.severity==='red'?'5 4':'0'}"/>`;
    if(opts.showZoneLabels){
      s += `<text x="${z.x+8}" y="${z.y+16}" font-size="11" font-family="Inter,sans-serif" fill="${c}" font-weight="600">${escapeHtml(z.name.toUpperCase())}</text>`;
    }
  });
  // anchors
  if(opts.showAnchors){
    state.anchors.forEach(a=>{
      s += `<circle cx="${a.x}" cy="${a.y}" r="26" fill="var(--accent)" fill-opacity="0.05" stroke="var(--accent)" stroke-opacity="0.35" stroke-dasharray="3 3"/>`;
      s += `<rect x="${a.x-4}" y="${a.y-4}" width="8" height="8" fill="var(--accent)" transform="rotate(45 ${a.x} ${a.y})"/>`;
      s += `<text x="${a.x+9}" y="${a.y+3}" font-size="8.5" font-family="IBM Plex Mono,monospace" fill="var(--text-faint)">${a.id}</text>`;
    });
  }
  // workers
  if(opts.showWorkers){
    state.workers.forEach(w=>{
      s += `<circle cx="${w.x}" cy="${w.y}" r="6" fill="var(--panel)" stroke="var(--info)" stroke-width="1.6"/>`;
      s += `<text x="${w.x}" y="${w.y+3}" font-size="7" text-anchor="middle" font-family="IBM Plex Mono,monospace" fill="var(--text)">${w.id.replace('W-','')}</text>`;
      s += `<text x="${w.x}" y="${w.y+17}" font-size="8" text-anchor="middle" font-family="Inter,sans-serif" fill="var(--text-faint)">${w.id}</text>`;
    });
  }
  // forklifts
  state.forklifts.forEach(f=>{
    const ringColor = f.status!=='ACTIVE' ? 'var(--text-faint)' : f.proxState==='DANGER' ? 'var(--danger)' : f.proxState==='WARNING' ? 'var(--warn)' : 'var(--safe)';
    const click = opts.interactive ? ` style="cursor:pointer" onclick="openDrawer('forklift','${f.id}')"` : '';
    s += `<g${click}>`;
    if(f.status==='ACTIVE' && f.proxState!=='SAFE'){
      s += `<circle cx="${f.x}" cy="${f.y}" r="16" fill="${ringColor}" fill-opacity="0.16"><animate attributeName="r" values="14;20;14" dur="1.6s" repeatCount="indefinite"/></circle>`;
    }
    s += `<rect x="${f.x-11}" y="${f.y-9}" width="22" height="18" rx="3" fill="var(--panel)" stroke="${ringColor}" stroke-width="2"/>`;
    s += `<text x="${f.x}" y="${f.y+4}" font-size="9" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-weight="700" fill="var(--text)">${f.id.slice(-2)}</text>`;
    s += `<text x="${f.x}" y="${f.y+24}" font-size="8" text-anchor="middle" font-family="Inter,sans-serif" fill="var(--text-dim)">${f.id}</text>`;
    s += `</g>`;
  });
  s += `</svg>`;
  return s;
}

function overallSafetyStatus(){
  const critical = state.forklifts.some(f=>f.riskState==='CRITICAL' || f.proxState==='DANGER');
  const high = state.forklifts.some(f=>f.riskState==='HIGH' || f.proxState==='WARNING');
  if(critical) return {label:'CRITICAL', cls:'critical', color:'--danger'};
  if(high) return {label:'ELEVATED', cls:'high', color:'--warn'};
  return {label:'NORMAL', cls:'safe', color:'--safe'};
}

function renderCameraFeed(f, w){
  if(f.status!=='ACTIVE'){
    return `<div class="cam-frame"><div class="empty-state" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      ${icon('camera',30)}<div style="margin-top:8px;color:var(--text-dim)">Camera idle — forklift ${f.status.toLowerCase()}</div>
    </div></div>`;
  }
  // synthetic "camera view": place a horizon + detected boxes for nearest worker & forklift
  const jitter = (state.sim.tick%2===0) ? 1 : -1;
  const boxes = [];
  if(w){
    const bx = 46 + jitter*1.2, by = 30, bw = 16, bh = 34;
    boxes.push({x:bx,y:by,w:bw,h:bh,label:'Pedestrian',conf:(0.86+Math.random()*0.1).toFixed(2),
      dist:f._nearestDist.toFixed(1), dir: f.x> w.x ? 'Left':'Right', color:f.proxState==='DANGER'?'#F0473C':f.proxState==='WARNING'?'#F0A83B':'#33D482'});
  }
  const nf = nearestForklift(f);
  if(nf.forklift && nf.distanceM<25){
    boxes.push({x:66,y:34,w:22,h:20,label:'Forklift',conf:(0.9+Math.random()*0.08).toFixed(2),
      dist:nf.distanceM.toFixed(1), dir:'Ahead', color:'#4E8CFF'});
  }
  let svg = `<svg viewBox="0 0 100 56" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
    <defs><linearGradient id="camgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1522"/><stop offset="1" stop-color="#05070a"/>
    </linearGradient></defs>
    <rect width="100" height="56" fill="url(#camgrad)"/>
    <line x1="0" y1="30" x2="100" y2="30" stroke="#1b2a3a" stroke-width="0.6"/>
    <rect x="0" y="30" width="100" height="26" fill="#0a0f16"/>`;
  boxes.forEach(b=>{
    svg += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="none" stroke="${b.color}" stroke-width="0.7"/>
      <text x="${b.x}" y="${b.y-1.4}" font-size="2.6" fill="${b.color}" font-family="IBM Plex Mono,monospace">${b.label} ${b.conf}</text>
      <text x="${b.x}" y="${b.y+b.h+3.4}" font-size="2.4" fill="${b.color}" font-family="IBM Plex Mono,monospace">${b.dist}m · ${b.dir}</text>`;
  });
  svg += `</svg>`;
  return `<div class="cam-frame">
    ${svg}
    <div class="cam-hud">${f.id} · ${f.camera}<br/>REC ● SIMULATED</div>
    <div class="cam-hud-r">${new Date().toLocaleTimeString()}<br/>Zone: ${f._zone||'Open Floor'}</div>
  </div>`;
}

    return {w, best, bd, ps};
  });
  return `
    <div class="view-head">

        <div class="kv-row"><span class="k">Danger distance</span><span class="v mono">&lt; ${state.thresholds.warning} m</span></div>
        <div style="margin-top:10px"><button class="btn sm" onclick="goTo('settings')">Edit in Settings</button></div>
        <div class="panel-title" style="margin-top:18px;font-size:13px">Forklift Proximity Status</div>
        <div class="table-wrap" style="margin-top:8px"><table>
          <thead><tr><th>Forklift</th><th>Nearest Worker</th><th>Distance</th><th>State</th></tr></thead>
          <tbody>
            ${state.forklifts.filter(f=>f.status==='ACTIVE').map(f=>`<tr class="clickable" onclick="openDrawer('forklift','${f.id}')">
              <td class="mono">${f.id}</td><td class="mono">${f._nearestWorker||'—'}</td>
              <td class="mono">${f._nearestDist!=null?f._nearestDist.toFixed(1)+'m':'—'}</td><td>${proxBadge(f.proxState)}</td>
            </tr>`).join('') || emptyRow(4,'No active forklifts')}
          </tbody>
        </table></div>
      </div>
    </div>
    <div class="grid g-2" style="margin-top:14px">
      <div class="panel">
        ${panelHead('Workers', state.workers.length+' tracked tags')}
        <div class="table-wrap"><table>

          <tbody>
            ${wRows.map(r=>`<tr>
              <td class="mono">${r.w.id}</td><td class="mono">${r.w.tag}</td>
              <td class="mono">${r.best?r.best.id:'—'}</td><td class="mono">${isFinite(r.bd)?r.bd.toFixed(1)+'m':'—'}</td>
              <td>${proxBadge(r.ps)}</td>

          </tbody>
        </table></div>
      </div>
      <div class="panel">
        ${panelHead('Active Proximity Alerts')}

/* ---------- Safety Events ---------- */
function renderEvents(){
  const f = state.eventFilters;
  const rangeMs = {today:86400000, '7d':7*86400000, '30d':30*86400000, all:Infinity}[f.range];
  let rows = state.events.filter(e=> Date.now()-e.ts <= rangeMs );

function renderAnalytics(){
  const html = `
    <div class="view-head">
      <div><div class="view-title">Analytics</div><div class="view-sub">Fleet &amp; safety analytics</div></div>
      <div class="view-actions">
        <select id="analytics-range" onchange="renderCurrentView(false)">

        </select>
      </div>
    </div>

      <div class="panel">${panelHead('Fleet Utilization')}<div style="height:240px"><canvas id="chart-util"></canvas></div></div>
    </div>
    <div class="grid g-2" style="margin-top:14px">
      <div class="panel">${panelHead('Proximity Events Over Time')}<div style="height:240px"><canvas id="chart-prox"></canvas></div></div>
      <div class="panel">${panelHead('Event Type Breakdown')}<div style="height:240px"><canvas id="chart-type"></canvas></div></div>
    </div>
  `;
  setTimeout(buildAnalyticsCharts, 0);
  return html;
}
function buildAnalyticsCharts(){
  if(typeof Chart==='undefined') return;
  ['chart-sev','chart-util','chart-prox','chart-type'].forEach(destroyChart);
  const grid = themedGrid(), txt = themedText();
  Chart.defaults.color = txt; Chart.defaults.borderColor = grid; Chart.defaults.font.family='Inter, sans-serif';

  const rangeSel = document.getElementById('analytics-range');
  const rangeMs = {today:86400000, '7d':7*86400000, '30d':30*86400000}[rangeSel?rangeSel.value:'7d'] || 7*86400000;
  const evInRange = state.events.filter(e=> Date.now()-e.ts <= rangeMs);

  const sevCounts = {LOW:0,MEDIUM:0,HIGH:0,CRITICAL:0};
  evInRange.forEach(e=>{ if(sevCounts[e.severity]!=null) sevCounts[e.severity]++; });
  const c1 = document.getElementById('chart-sev');
  if(c1) state.charts['chart-sev'] = new Chart(c1, {type:'bar', data:{labels:Object.keys(sevCounts),
    datasets:[{label:'Events', data:Object.values(sevCounts), backgroundColor:['#33D482','#F0A83B','#F0473C','#a8281f']}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}}}});

  const c2 = document.getElementById('chart-util');
  if(c2) state.charts['chart-util'] = new Chart(c2, {type:'doughnut', data:{
    labels:['Active','Idle','Charging','Maintenance','Offline'],
    datasets:[{data:['ACTIVE','IDLE','CHARGING','MAINTENANCE','OFFLINE'].map(s=>state.forklifts.filter(f=>f.status===s).length),
      backgroundColor:['#33D482','#8B9BB4','#F0A83B','#4E8CFF','#F0473C']}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10}}}}});

  const buckets = new Array(8).fill(0);
  evInRange.filter(e=>e.type==='PEDESTRIAN PROXIMITY').forEach((e,i)=>{ buckets[i%8]++; });
  const c3 = document.getElementById('chart-prox');
  if(c3) state.charts['chart-prox'] = new Chart(c3, {type:'line', data:{labels:buckets.map((_,i)=>'T-'+(8-i)),
    datasets:[{label:'Proximity Events', data:buckets, borderColor:'#4E8CFF', backgroundColor:'rgba(78,140,255,0.15)', fill:true, tension:.35}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}}}});

  const typeCounts = {};
  evInRange.forEach(e=>{ typeCounts[e.type]=(typeCounts[e.type]||0)+1; });
  const c4 = document.getElementById('chart-type');
  if(c4) state.charts['chart-type'] = new Chart(c4, {type:'bar', data:{labels:Object.keys(typeCounts),
    datasets:[{label:'Count', data:Object.values(typeCounts), backgroundColor:'#4E8CFF'}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{precision:0}}}}});
}

/* ---------- ARK Predict — machine-health anomaly detection (HTH-ML-10) ----------
   Live view over the backend's /api/anomaly stream: context-aware per-sensor
   detectors + Isolation Forest, severity 0-100, tiered routing
   (IGNORE -> log, MONITOR -> maintenance queue, URGENT -> page), root-cause hints.
   Unlike the rest of this demo page (client-side simulation), this view talks
   to the real Python backend. */
const PR_API = (location.protocol.startsWith('http') ? '' : 'http://localhost:4000') + '/api/anomaly';
const PR = {online:null, cfg:null, status:null, machines:[], machine:'ARK-F002', feed:[], feedMode:'alerts',
  lastAlertId:null, series:null, summary:null, timer:null, busy:false, summaryAt:0, points:240, tick:0};
const PR_TIER_VAR = {OK:'--safe', IGNORE:'--info', MONITOR:'--warn', URGENT:'--danger'};
const PR_INFO_LABEL = {models:'Models that flagged it', gauss_score:'Gaussian (joint-shift) score',since:'Started', slope_z_per_min:'Slope (σ / min)', time_to_limit_s:'Time to hard limit (s)', ewma_z:'Smoothed deviation (σ)',
  missing_s:'Seconds without data', stuck_s:'Seconds frozen', value:'Frozen value', spikes_in_window:'Spikes in window', window_s:'Window (s)',
  top_sensors:'Sensors the model points at', ml_score:'ML score', model:'Raised by', if_score:'Isolation Forest score',
  ae_score:'Autoencoder score'};
const PR_AE_COLOR = '#A78BFA';
const PR_G_COLOR = '#2DD4BF';
const PR_COMP_LABEL = {feedback:'Technician feedback (learned)', type:'Anomaly type', magnitude:'Magnitude', persistence:'Persistence', trend:'Trend / blind time',
  spread:'Spread on truck', ml:'ML evidence (Isolation Forest)'};

function prVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function prTierColor(t){ return prVar(PR_TIER_VAR[t]||'--info') || '#8B9BB4'; }
function prTierBadge(t){ return badge(t, ({OK:'safe',IGNORE:'info',MONITOR:'warning',URGENT:'critical'}[t]||'info')+' dot'); }
function prFmtT(t){ if(t==null) return '—'; const s=Math.max(0,t-(PR.status?PR.status.simT-PR.status.monitoredS:0));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0'); }
function prFmtNum(n){ return n==null ? '—' : Number(n).toLocaleString(); }
function prPct(x){ return x==null ? '—' : Math.round(x*100)+'%'; }

async function prFetch(path, opts){
  const r = await fetch(PR_API+path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  if(!r.ok){ let msg=r.status; try{ msg=(await r.json()).error||msg; }catch(e){} throw new Error(msg); }
  return path.endsWith('.md') ? r.text() : r.json();
}
function prPost(path, body){ return prFetch(path, {method:'POST', body:JSON.stringify(body||{})}); }

/* ---------- lifecycle ---------- */
function predictBoot(){ if(PR.timer) return; PR.timer = setInterval(prTick, 1000); prTick(); }
function predictStop(){ clearInterval(PR.timer); PR.timer=null; }
async function prTick(){
  if(PR.busy) return; PR.busy = true; PR.tick++;
  try{
    if(state.activeView==='predict') await prRefresh();
    else if(PR.tick%2===0 || PR.lastAlertId===null) await prPollAlerts();
  }catch(e){ prSetOffline(e); }
  finally{ PR.busy=false; }
}
function prSetOffline(e){
  const was = PR.online; PR.online = false;
  const el = document.getElementById('pr-status');
  if(el) el.innerHTML = badge('BACKEND OFFLINE','critical dot');
  const off = document.getElementById('pr-offline');
  if(off) off.style.display='block';
  if(was!==false && state.activeView==='predict') pushToast('HIGH','ARK Predict backend unreachable', 'Start it with: uvicorn app.main:app --port 4000');
}

/* routed machine-health alerts also land in the global Alert Center */
async function prPollAlerts(){
  const alerts = await prFetch('/alerts?limit=25');
  PR.online = true;
  if(PR.lastAlertId===null){ PR.lastAlertId = alerts.length ? alerts[0].id : 0; return; }
  const fresh = alerts.filter(a=>a.id>PR.lastAlertId).reverse();
  fresh.forEach(a=>{
    const sev = a.tier==='URGENT' ? 'CRITICAL' : 'MEDIUM';
    const title = `${a.tier==='URGENT'?'URGENT':'MONITOR'} — ${a.title.split(' · ').slice(1).join(' · ')}`;
    if(a.tier==='URGENT'){
      createAlert({severity:sev, title, forklift:a.machine, type:'MACHINE_HEALTH'});
    }else{
      state.alerts.unshift({id:uid('ALT'), ts:Date.now(), severity:sev, title, forklift:a.machine, type:'MACHINE_HEALTH', status:'ACTIVE'});
      if(state.alerts.length>200) state.alerts.length=200;
    }
  });
  if(alerts.length) PR.lastAlertId = Math.max(PR.lastAlertId, alerts[0].id);
  if(fresh.length) renderLiveWidgets();
}

async function prRefresh(){
  if(!PR.cfg) PR.cfg = await prFetch('/config');
  const [st, machines, series, feed] = await Promise.all([
    prFetch('/status'), prFetch('/machines'),
    prFetch('/series?machineId='+encodeURIComponent(PR.machine)+'&points='+PR.points),
    prFetch('/feed?limit=80'),
  ]);
  PR.online = true; PR.status = st; PR.machines = machines; PR.series = series; PR.feed = feed;
  await prPollAlerts();
  if(state.activeView!=='predict') return;
  const off = document.getElementById('pr-offline'); if(off) off.style.display='none';
  prRenderStatus(); prRenderTiles(); prRenderFleet(); prUpdateCharts(); prRenderFeed();
  if(Date.now()-PR.summaryAt > 6000){
    PR.summaryAt = Date.now();
    const [sum, fb] = await Promise.all([prFetch('/summary'), prFetch('/feedback').catch(()=>null)]);
    PR.summary = sum; PR.learned = fb; prRenderSummary(); prRenderLearned();
  }
}

/* ---------- charts: dependency-free SVG (works offline, no CDN needed) ---------- */
function prChartSvgInner(lines, bands, xmin, xmax, yExtra){
  const W=1000, H=100, P=4;
  let lo=Infinity, hi=-Infinity;
  lines.forEach(l=>l.pts.forEach(p=>{ if(p[1]!=null && isFinite(p[1])){ lo=Math.min(lo,p[1]); hi=Math.max(hi,p[1]); } }));
  (yExtra||[]).forEach(v=>{ lo=Math.min(lo,v); hi=Math.max(hi,v); });
  if(!isFinite(lo)){ lo=0; hi=1; }
  if(hi-lo<1e-9){ hi+=0.5; lo-=0.5; }
  const pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
  const X = x => (x-xmin)/Math.max(1,xmax-xmin)*W;
  const Y = y => P + (1-(y-lo)/(hi-lo))*(H-2*P);
  let svg = '';
  bands.forEach(b=>{
    const x1=Math.max(0,X(b.from-0.5)), x2=Math.min(W,X(b.to+0.5)); if(x2<=x1) return;
    if(b.truth) svg += `<rect x="${x1.toFixed(1)}" y="${H-3}" width="${(x2-x1).toFixed(1)}" height="3" fill="var(--accent)" opacity=".9"/>`;
    else svg += `<rect x="${x1.toFixed(1)}" y="0" width="${Math.max(3,x2-x1).toFixed(1)}" height="${H}" fill="${cssVar(PR_TIER_VAR[b.tier]||'--info')}" opacity="${b.tier==='IGNORE'?0.18:0.24}"/>`;
  });
  lines.forEach(l=>{
    let d='', pen=false;
    l.pts.forEach(p=>{
      if(p[1]==null || !isFinite(p[1])){ pen=false; return; }
      d += (pen?'L':'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); pen=true;
    });
    if(d) svg += `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.width||1.4}" ${l.dash?`stroke-dasharray="${l.dash}"`:''} vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  });
  return {svg, lo, hi};
}
function prDrawChart(key, lines, bands, xmin, xmax, yExtra, decimals){
  const el = document.getElementById('pr-c-'+key); if(!el) return;
  const r = prChartSvgInner(lines, bands, xmin, xmax, yExtra);
  el.innerHTML = r.svg;
  const box = el.parentNode;
  const hi = box.querySelector('.pr-y.hi'), lo = box.querySelector('.pr-y.lo');
  if(hi) hi.textContent = r.hi.toFixed(decimals);
  if(lo) lo.textContent = r.lo.toFixed(decimals);
}
function prInitCharts(){ /* SVG charts are redrawn on every refresh; nothing to set up */ }
function prUpdateCharts(){
  const sr = PR.series; if(!sr || !PR.cfg) return;
  const title = document.getElementById('pr-chart-title');
  if(title && title.firstChild) title.firstChild.nodeValue = `Live sensors — ${sr.machine} `;
  const xmin = sr.tNow - PR.points + 1, xmax = sr.tNow;
  PR.cfg.sensors.forEach(s=>{
    const d = sr.sensors[s.key]; if(!d) return;
    const bands = d.incidents.map(b=>({from:b.from, to:b.to, tier:b.tier}))
      .concat(sr.injected.filter(a=>a.sensors.includes(s.key)).map(a=>({from:a.start, to:Math.min(a.end, sr.tNow), truth:true})));
    prDrawChart(s.key, [
      {pts:d.t.map((t,i)=>[t, d.expected[i]]), color:'var(--text-faint)', dash:'5 4', width:1},
      {pts:d.t.map((t,i)=>[t, d.value[i]]), color:'var(--accent)', width:1.5},
    ], bands, xmin, xmax, null, s.decimals);
    const m = PR.machines.find(x=>x.id===sr.machine), last = m && m.latest[s.key];
    const lbl = document.getElementById('pr-v-'+s.key);
    if(lbl && last){
      const st = last.state==='ok' ? '' : ' '+badge(last.state.toUpperCase(), last.state==='drift'?'warning':'critical');
      lbl.innerHTML = `${last.value==null?'— no data':Number(last.value).toFixed(s.decimals)+' '+escapeHtml(s.unit)}`+
        `${last.z==null?'':` · <span style="color:${Math.abs(last.z)>=3?'var(--warn)':'var(--text-faint)'}">z ${last.z>0?'+':''}${Number(last.z).toFixed(1)}</span>`}${st}`;
    }
  });
  const trig = sr.ml.trigger || 1.6, ifs = sr.ml.iforest || sr.ml.score, aes = sr.ml.autoencoder || [], gss = sr.ml.gaussian || [];
  prDrawChart('ml', [
    {pts:[[xmin,trig],[xmax,trig]], color:'var(--text-faint)', dash:'5 4', width:1},
    {pts:sr.ml.t.map((t,i)=>[t, ifs[i]]), color:'var(--high)', width:1.2},
    {pts:sr.ml.t.map((t,i)=>[t, gss[i]]), color:PR_G_COLOR, width:1.3},
    {pts:sr.ml.t.map((t,i)=>[t, aes[i]]), color:PR_AE_COLOR, width:1.6},
  ], sr.injected.map(a=>({from:a.start, to:Math.min(a.end, sr.tNow), truth:true})), xmin, xmax, [0, 2], 1);
  const n = sr.ml.t.length;
  const lbl = document.getElementById('pr-v-ml');
  if(lbl) lbl.innerHTML = n ? `<span style="color:var(--high)">IF ${(+ifs[n-1]).toFixed(1)}</span> · <span style="color:${PR_G_COLOR}">G ${(+(gss[n-1]||0)).toFixed(1)}</span> · <span style="color:${PR_AE_COLOR}">AE ${(+(aes[n-1]||0)).toFixed(1)}</span>` : '';
}

    <div class="drawer-body">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">${prTierBadge(i.tier)} ${statusBadge(i.status==='OPEN'?'OPEN':'RESOLVED')}
        <span class="mono" style="margin-left:auto;font-size:22px;font-weight:600">${i.severity}<small style="font-size:11px;color:var(--text-faint)">/100</small></span></div>
      <div class="kv-row"><span class="k">Routed to</span><span class="v">${escapeHtml(i.route)}</span></div>
      <div class="kv-row"><span class="k">Peak tier / severity</span><span class="v">${i.maxTier} / ${i.maxSeverity}</span></div>
      <div class="kv-row"><span class="k">Opened · duration</span><span class="v mono">${prFmtT(i.openedT)} · ${i.durationS}s</span></div>
      ${i.groupId && i.groupId!==i.id ? `<div class="kv-row"><span class="k">Grouped into</span><span class="v">alert #${i.groupId}</span></div>`:''}
      <div class="pr-sub" style="margin-top:14px">Likely root cause</div>
      <div class="pr-rc"><b>${escapeHtml(rc.title||'—')}</b>${rc.action?`<div>→ ${escapeHtml(rc.action)}</div>`:''}
        ${(rc.evidence||[]).map(e=>`<div class="pr-ev">• ${escapeHtml(e)}</div>`).join('')}</div>
      <div class="pr-sub" style="margin-top:14px">Why this severity</div>
      ${comps.map(([k,v])=>`<div class="pr-fun"><span>${PR_COMP_LABEL[k]||k}</span><div class="pr-fun-bar"><i style="width:${Math.min(100,v/35*100)}%;background:${prTierColor(i.tier)}"></i></div><b class="mono">${v}</b></div>`).join('')}
      <div class="pr-expl">${escapeHtml(i.explanation||'')}</div>
      ${info.length?`<div class="pr-sub" style="margin-top:14px">Detector detail</div>${info.map(([k,v])=>`<div class="kv-row"><span class="k">${escapeHtml(PR_INFO_LABEL[k]||k)}</span><span class="v mono">${escapeHtml(k==='since'?prFmtT(v):Array.isArray(v)?v.join(', '):v==null?'—':v)}</span></div>`).join('')}`:''}
      <div class="pr-sub" style="margin-top:14px">Technician verdict ${i.feedback?badge(PR_FB_LABEL[i.feedback]||i.feedback,'info'):''}</div>
      <div class="pr-fb">
        ${Object.entries(PR_FB_LABEL).map(([k,l])=>`<button class="btn sm ${i.feedback===k?'accent':''}" onclick="prFeedback(${i.id},'${k}')">${l}</button>`).join('')}
      </div>
      <div class="pr-expl" style="margin-top:6px">The system learns a severity correction for this kind of incident (${escapeHtml(i.type.replace('_',' '))} on ${escapeHtml(i.sensorLabel.toLowerCase())}) and applies it next time.</div>
      ${(i.tierHistory||[]).length?`<div class="pr-sub" style="margin-top:14px">Tier history</div>${i.tierHistory.map(h=>`<div class="kv-row"><span class="k mono">${prFmtT(h.t)}</span><span class="v">${prTierBadge(h.tier)} sev ${h.severity}</span></div>`).join('')}`:''}
    </div>`;
}

const PR_FB_LABEL = {right_call:'Right call', too_high:'Too urgent', too_low:'Not urgent enough', false_alarm:'False alarm'};
async function prFeedback(id, label){
  try{
    const r = await prPost('/feedback', {incidentId:id, label});
    const sensor = r.sensor==='*' ? 'any sensor' : r.sensor.replace(/_/g,' ');
    pushToast('INFO', `Learned: ${PR_FB_LABEL[label]}`,
      `Future ${r.type.replace('_',' ')} alerts on ${sensor}: ${r.learnedOffset>0?'+':''}${r.learnedOffset} severity`);
    PR.learned = {learned:r.table}; prRenderLearned();
    PR.incident = await prFetch('/incidents/'+id); renderDrawer();
  }catch(e){ pushToast('HIGH','Feedback failed', String(e.message||e)); }
}
function prRenderLearned(){
  const el = document.getElementById('pr-learned'); if(!el) return;
  const rows = (PR.learned && PR.learned.learned) || [];
  if(!rows.length){ el.innerHTML = '<div class="pr-expl" style="margin:0">No verdicts yet.</div>'; return; }
  el.innerHTML = rows.slice(0,5).map(r=>`<div class="kv-row"><span class="k">${escapeHtml(r.type.replace('_',' '))} · ${escapeHtml(r.sensor==='*'?'any':r.sensor.replace(/_/g,' '))} <small style="color:var(--text-faint)">(${r.labels} verdict${r.labels>1?'s':''})</small></span>
    <span class="v mono" style="color:${r.offset<0?'var(--safe)':r.offset>0?'var(--warn)':'var(--text-dim)'}">${r.offset>0?'+':''}${r.offset}</span></div>`).join('');
}

/* ---------- controls ---------- */
async function prToggleRun(){ try{ PR.status = await prPost(PR.status&&PR.status.running?'/pause':'/start'); prRenderStatus(); }catch(e){ prSetOffline(e); } }
async function prReset(){ try{ await prPost('/reset'); PR.lastAlertId=null; PR.summaryAt=0; pushToast('INFO','Anomaly stream reset','Baselines re-learned from a fresh warm-up'); prTick(); }catch(e){ prSetOffline(e); } }
async function prSetSpeed(v){ try{ PR.status = await prPost('/speed',{speed:+v}); }catch(e){ prSetOffline(e); } }
async function prSetRate(v){ try{ PR.status = await prPost('/fault-rate',{ratePerMin:+v}); }catch(e){ prSetOffline(e); } }
async function prInject(scenario, sensor){
  const machine = (document.getElementById('pr-in-machine')||{}).value || PR.machine;
  scenario = scenario || document.getElementById('pr-in-scen').value;
  if(sensor===undefined) sensor = (document.getElementById('pr-in-sensor')||{}).value || null;
  try{
    const r = await prPost('/inject', {scenario, machineId:machine, sensor});
    const inj = r.injected;
    pushToast('INFO', `Injected ${scenario.replace('_',' ')} on ${machine}`, `${inj.sensors.join(', ')} · truth tier ${inj.truthTier} · ${inj.end-inj.start+1}s`);
    if(machine!==PR.machine) prSelect(machine);
  }catch(e){ pushToast('HIGH','Injection failed', String(e.message||e)); }
}
async function prDownloadReport(){
  try{
    const md = await prFetch('/report.md');
    const url = URL.createObjectURL(new Blob([md], {type:'text/markdown'}));
    const a = document.createElement('a'); a.href = url; a.download = 'ark-predict-report.md';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }catch(e){ pushToast('HIGH','Report unavailable', String(e.message||e)); }
}
/* ============================================================
   ARK SHIELD — login + bootstrap
   ============================================================ */
let selectedRole = 'SAFETY_MANAGER';

function buildLogin(){
  const el = document.getElementById('login-screen');
  el.innerHTML = `
    <div class="login-card">
      <div class="login-brand">${brandMark(30)}<span class="login-brand-text">ARK<b>SHIELD</b></span></div>
      <p class="login-tag">Intelligent Safety for Industrial Mobility</p>
      <div class="field"><label>Name</label><input id="login-name" type="text" placeholder="e.g. Jordan Reyes" value="Jordan Reyes"></div>
      <div class="field">
        <label>Role (demo — determines what you can see and do)</label>
        <div class="role-grid" id="role-grid">
          ${ROLES.map(r=>`<div class="role-opt ${r.id===selectedRole?'active':''}" data-role="${r.id}" onclick="pickRole('${r.id}')">
            <span class="rname">${r.label}</span>${r.desc}
          </div>`).join('')}
        </div>
      </div>
      <button class="btn-primary" onclick="doLogin()">Enter Command Center</button>
      <p class="login-note">Demo authentication only — no real credentials are stored or verified.</p>
    </div>
  `;
}
function pickRole(id){
  selectedRole = id;
  document.querySelectorAll('.role-opt').forEach(el=>el.classList.toggle('active', el.dataset.role===id));
}
function doLogin(){
  const name = document.getElementById('login-name').value.trim() || 'Operator';
  state.auth = {loggedIn:true, name, role:selectedRole};
  document.getElementById('login-screen').style.display='none';
  const app = document.getElementById('app');
  app.classList.add('show');
  buildShell();
  state.activeView = NAV_ITEMS.find(n=>n.roles.includes(selectedRole)) ? state.activeView : 'overview';
  if(!NAV_ITEMS.find(n=>n.id===state.activeView && n.roles.includes(selectedRole))){ state.activeView='overview'; }
  renderSidebarNav();
  renderCurrentView(false);
  startSim();
  predictBoot();
  pushToast('INFO','Welcome to ARK Shield', roleLabel(selectedRole)+' access');
}
function logout(){
  pauseSim();
  predictStop();
  state.auth = {loggedIn:false, name:'', role:null};
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').style.display='flex';
}

window.addEventListener('DOMContentLoaded', ()=>{
  buildLogin();
});
</script>
